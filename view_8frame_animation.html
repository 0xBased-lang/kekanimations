<!DOCTYPE html>
<html>
<head>
    <title>8-Frame NFT Animation - SUCCESS!</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        img {
            border: 3px solid #00ff00;
            border-radius: 5px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            box-shadow: 0 0 30px rgba(0,255,0,0.5);
        }
        .stats {
            margin-top: 20px;
            text-align: left;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ff00;
        }
        .stat-line {
            margin: 5px 0;
        }
        .success {
            color: #00ff00;
            font-weight: bold;
        }
        .filename {
            color: #00aaff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 8-FRAME ANIMATION SUCCESS! 🎉</h1>
        <img src="final_output/normie_8frames_SUCCESS.gif" alt="Normie 8-Frame Animation">
        <div class="stats">
            <div class="stat-line"><span class="success">✅ FRAMES:</span> 8</div>
            <div class="stat-line"><span class="success">✅ RESOLUTION:</span> 512×512</div>
            <div class="stat-line"><span class="success">✅ FORMAT:</span> GIF</div>
            <div class="stat-line"><span class="success">✅ FILE SIZE:</span> 2.5MB</div>
            <div class="stat-line"><span class="filename">📁 FILE:</span> normie_8frames_SUCCESS.gif</div>
        </div>
        <p style="margin-top: 20px; color: #888;">
            This is your first successful 8-frame animation!<br>
            The workflow is now proven and ready for batch processing.
        </p>
    </div>
</body>
</html>
